url: https://lobsterbush.github.io/tufter/

template:
  bootstrap: 5
  bslib:
    base_font: {google: "Barlow"}
    heading_font: {google: "Cormorant Garamond"}
    code_font: {google: "JetBrains Mono"}
    primary: "#143a63"
    link-color: "#143a63"
    headings-font-weight: 600
    border-radius: "0"
    border-radius-sm: "0"
    border-radius-lg: "0"
    body-bg: "#ffffff"
    body-color: "#0c0c12"

home:
  title: Tufte's design principles as R code
  description: >
    Edward Tufte's principles of graphical design, as working ggplot2 code and
    as measurements you can apply to a figure you have already drawn.

navbar:
  structure:
    left: [intro, articles, reference, news]
    right: [website, search, github]
  components:
    website:
      text: Charles Crabtree
      href: https://charlescrabtree.org
    articles:
      text: Articles
      menu:
      - text: Working through a real dataset
        href: articles/real-data.html
      - text: Examples with simulated data
        href: articles/simulated-examples.html
      - text: Examples with live API data
        href: articles/live-data.html
      - text: Measuring a figure
        href: articles/measuring.html

authors:
  Charles Crabtree:
    href: https://charlescrabtree.org

footer:
  structure:
    left: statement
    right: legal
  components:
    statement: >
      <span class="footer-mark">tufter</span><br>Charles Crabtree ·
      [charles.crabtree@monash.edu](mailto:charles.crabtree@monash.edu) ·
      [charlescrabtree.org](https://charlescrabtree.org)
    legal: >
      MIT licensed · built with [pkgdown](https://pkgdown.r-lib.org/)<br>
      [AI – Human (editor) · 🤖✏️👤](https://thelatentreview.com/provenance/)

reference:
- title: Drawing
  desc: >
    The graphical forms Tufte designed or advocated, as ggplot2 layers, themes,
    scales and plot constructors.
- subtitle: Themes
  contents:
  - theme_tufte
  - theme_sparkline
  - theme_slopegraph
- subtitle: Frames and margins
  desc: >
    Replacements for the panel border, which is the same box whatever the
    numbers are.
  contents:
  - geom_rangeframe
  - quartile_breaks
  - geom_dotdash
- subtitle: Distributions and comparisons
  contents:
  - geom_tufteboxplot
  - geom_col_tufte
  - geom_cleveland_dot
  - slopegraph
  - facet_tufte
- subtitle: Word-sized graphics
  contents:
  - sparkline
  - sparklines
  - sparkline_grob
- subtitle: Colour and labelling
  desc: >
    Colour as a code rather than decoration, and words on the data rather than
    in a legend.
  contents:
  - tufte_pal
  - scale_colour_tufte
  - geom_text_last
  - label_source

- title: Measuring
  desc: >
    The quantities Tufte defined, so a finished figure can be examined as well
    as admired.
  contents:
  - data_ink_ratio
  - lie_factor
  - data_density
  - bank_to_45
  - check_contrast
  - contrast_ratio
  - check_labels_fit
- subtitle: Auditing
  contents:
  - tufte_audit
  - audit_figures

- title: Reference and output
  contents:
  - tufte_principles
  - save_tufte
  - tufter-package
