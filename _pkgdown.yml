url: https://lobsterbush.github.io/tufter/

template:
  bootstrap: 5
  # Soft gate over the whole site while the package is unreleased. This keeps
  # casual visitors and search engines out. It is NOT access control: every
  # page and image remains a public static file that can be fetched directly.
  # See data-raw/build_site.R for how to take the site down properly.
  includes:
    in_header: |
      <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
      <script>
      (function () {
        var KEY = "tufter-gate-v1";
        var HASH = "b0df6b7092f74262b9b24590e8cc2c9f601b48a73194c7d18042dc140d0e27ca";
        try {
          if (window.sessionStorage && sessionStorage.getItem(KEY) === HASH) return;
        } catch (e) { /* storage blocked; fall through to the prompt */ }

        var hide = document.createElement("style");
        hide.textContent = "html{visibility:hidden!important}";
        document.head.appendChild(hide);

        function digest(text) {
          var bytes = new TextEncoder().encode(text);
          return crypto.subtle.digest("SHA-256", bytes).then(function (buf) {
            return Array.prototype.map.call(new Uint8Array(buf), function (b) {
              return b.toString(16).padStart(2, "0");
            }).join("");
          });
        }

        function gate() {
          document.title = "tufter";
          document.body.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;' +
            'justify-content:center;font-family:system-ui,sans-serif;' +
            'background:#fff;color:#1a1a1a">' +
            '<form id="g" style="max-width:22rem;width:100%;padding:2rem">' +
            '<h1 style="font-size:1.5rem;font-weight:600;margin:0 0 .5rem">tufter</h1>' +
            '<p style="color:#555;margin:0 0 1.25rem;line-height:1.5">' +
            'Documentation for an unreleased R package. Enter the password to continue.</p>' +
            '<input id="p" type="password" autocomplete="current-password" ' +
            'autofocus aria-label="Password" style="width:100%;padding:.6rem .7rem;' +
            'border:1px solid #ccc;border-radius:6px;font-size:1rem;box-sizing:border-box">' +
            '<p id="e" role="alert" style="color:#a1483c;min-height:1.4em;margin:.5rem 0 0;' +
            'font-size:.9rem"></p>' +
            '<button type="submit" style="margin-top:.5rem;width:100%;padding:.6rem;' +
            'border:0;border-radius:6px;background:#3730a3;color:#fff;font-size:1rem;' +
            'cursor:pointer">Continue</button>' +
            '</form></div>';
          hide.remove();

          document.getElementById("g").addEventListener("submit", function (ev) {
            ev.preventDefault();
            var err = document.getElementById("e");
            err.textContent = "";
            digest(document.getElementById("p").value).then(function (h) {
              if (h === HASH) {
                try { sessionStorage.setItem(KEY, HASH); } catch (e) {}
                location.reload();
              } else {
                err.textContent = "Not that one.";
                document.getElementById("p").select();
              }
            });
          });
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", gate);
        } else {
          gate();
        }
      })();
      </script>
  bslib:
    base_font: {google: "Plus Jakarta Sans"}
    heading_font: {google: "Cormorant Garamond"}
    code_font: {google: "JetBrains Mono"}
    primary: "#3730a3"
    link-color: "#3730a3"
    headings-font-weight: 600

home:
  title: Tufte's design principles as R code
  description: >
    Edward Tufte's principles of graphical design, as working ggplot2 code and
    as measurements you can apply to a figure you have already drawn.

navbar:
  structure:
    left: [intro, articles, reference, news]
    right: [search, github]
  components:
    articles:
      text: Articles
      menu:
      - text: Examples with simulated data
        href: articles/simulated-examples.html
      - text: Measuring a figure
        href: articles/measuring.html

authors:
  Charles Crabtree:
    href: https://charlescrabtree.org

reference:
- title: Drawing
  desc: >
    The graphical forms Tufte designed or advocated, as ggplot2 layers, themes,
    scales and plot constructors.
- subtitle: Themes
  contents:
  - theme_tufte
  - theme_sparkline
  - theme_slopegraph
- subtitle: Frames and margins
  desc: >
    Replacements for the panel border, which is the same box whatever the
    numbers are.
  contents:
  - geom_rangeframe
  - quartile_breaks
  - geom_dotdash
- subtitle: Distributions and comparisons
  contents:
  - geom_tufteboxplot
  - geom_col_tufte
  - geom_cleveland_dot
  - slopegraph
  - facet_tufte
- subtitle: Word-sized graphics
  contents:
  - sparkline
  - sparklines
  - sparkline_grob
- subtitle: Colour and labelling
  desc: >
    Colour as a code rather than decoration, and words on the data rather than
    in a legend.
  contents:
  - tufte_pal
  - scale_colour_tufte
  - geom_text_last
  - label_source

- title: Measuring
  desc: >
    The quantities Tufte defined, so that a finished figure can be scored
    rather than admired.
  contents:
  - data_ink_ratio
  - lie_factor
  - data_density
  - bank_to_45
  - check_contrast
  - contrast_ratio
  - check_labels_fit
- subtitle: Auditing
  contents:
  - tufte_audit
  - audit_figures

- title: Reference and output
  contents:
  - tufte_principles
  - save_tufte
  - tufter-package
